<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <filter id="n" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="4" stitchTiles="stitch" result="t"/>
    <feColorMatrix in="t" type="saturate" values="0" result="g"/>
    <feComponentTransfer in="g">
      <feFuncR type="linear" slope="1.35" intercept="-0.18"/>
      <feFuncG type="linear" slope="1.35" intercept="-0.18"/>
      <feFuncB type="linear" slope="1.35" intercept="-0.18"/>
      <feFuncA type="linear" slope="1" intercept="0"/>
    </feComponentTransfer>
  </filter>
  <rect width="300" height="300" filter="url(#n)"/>
</svg>
